# Memoria del daemon de Gradle: la PC tiene 7 GB de RAM y hay 3 GB libres,
# asi que se limita a 2 GB (la plantilla nueva pide 8 GB, demasiado aqui).
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=1G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Flags de compatibilidad para AGP 9 (los mismos que usa la plantilla
# oficial de Flutter 3.47): DSL clasico y Kotlin externo (KGP 2.4.0).
android.newDsl=false
android.builtInKotlin=false
kotlin.daemon.jvmargs=-Xmx1536M
